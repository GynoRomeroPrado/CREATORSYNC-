name: CreatorSync CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Job 1: Lint and validate code
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python linting tools
        run: |
          pip install black ruff mypy

      - name: Lint Python - Attribution Engine
        run: |
          cd backend/attribution-engine
          black --check app/
          ruff app/

      - name: Lint Python - Tax Optimizer
        run: |
          cd backend/tax-optimizer
          black --check app/
          ruff app/

      - name: Lint Python - Invoice Factoring
        run: |
          cd backend/invoice-factoring
          black --check app/
          ruff app/

      - name: Lint TypeScript - Brand CRM
        run: |
          cd backend/brand-crm
          npm install
          npm run lint || echo "Add lint script to package.json"

  # Job 2: Test Attribution Engine
  test-attribution:
    name: Test Attribution Engine
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: creatorsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-attribution-${{ hashFiles('backend/attribution-engine/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-attribution-

      - name: Install dependencies
        run: |
          cd backend/attribution-engine
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/creatorsync_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend/attribution-engine
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/attribution-engine/coverage.xml
          flags: attribution-engine
          name: attribution-engine-coverage

  # Job 3: Test Tax Optimizer
  test-tax-optimizer:
    name: Test Tax Optimizer
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: creatorsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libopencv-dev

      - name: Install dependencies
        run: |
          cd backend/tax-optimizer
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/creatorsync_test
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend/tax-optimizer
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/tax-optimizer/coverage.xml
          flags: tax-optimizer
          name: tax-optimizer-coverage

  # Job 4: Test Brand CRM
  test-brand-crm:
    name: Test Brand CRM
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: creatorsync_test
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: backend/brand-crm/node_modules
          key: ${{ runner.os }}-node-brand-crm-${{ hashFiles('backend/brand-crm/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-brand-crm-

      - name: Install dependencies
        run: |
          cd backend/brand-crm
          npm ci

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: creatorsync_test
          REDIS_URL: redis://localhost:6379/2
        run: |
          cd backend/brand-crm
          npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/brand-crm/coverage/lcov.info
          flags: brand-crm
          name: brand-crm-coverage

  # Job 5: Test Invoice Factoring
  test-invoice-factoring:
    name: Test Invoice Factoring
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: creatorsync_test
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/invoice-factoring
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/creatorsync_test
          REDIS_URL: redis://localhost:6379/3
        run: |
          cd backend/invoice-factoring
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/invoice-factoring/coverage.xml
          flags: invoice-factoring
          name: invoice-factoring-coverage

  # Job 6: Build Docker images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-attribution, test-tax-optimizer, test-brand-crm, test-invoice-factoring]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Attribution Engine
        uses: docker/build-push-action@v5
        with:
          context: ./backend/attribution-engine
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-attribution:latest
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-attribution:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Tax Optimizer
        uses: docker/build-push-action@v5
        with:
          context: ./backend/tax-optimizer
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-tax:latest
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-tax:${{ github.sha }}

      - name: Build and push Brand CRM
        uses: docker/build-push-action@v5
        with:
          context: ./backend/brand-crm
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-brand-crm:latest
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-brand-crm:${{ github.sha }}

      - name: Build and push Invoice Factoring
        uses: docker/build-push-action@v5
        with:
          context: ./backend/invoice-factoring
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-factoring:latest
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-factoring:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web-app
          file: ./frontend/web-app/Dockerfile.dev
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/creatorsync-frontend:${{ github.sha }}

  # Job 7: Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
